<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Portal - Xbox Flight Sim Companion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2338bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>');
      background-repeat: no-repeat;
      background-position: right 12px center;
      cursor: pointer;
    }

    select:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background-color: #0284c7;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #0369a1;
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      display: none;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-label {
      color: #94a3b8;
    }

    .result-value {
      font-weight: 600;
      color: #38bdf8;
    }

    .simbrief-btn {
      display: block;
      width: 100%;
      text-align: center;
      margin-top: 16px;
      padding: 12px;
      background-color: #10b981;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }

    .simbrief-btn:hover {
      background-color: #059669;
    }

    .error-text {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dispatch Portal</h1>
    <p class="subtitle">Xbox Flight Sim Companion</p>
  </header>

  <main class="card">
    <div class="form-group">
      <label for="airlineSelect">SELECCIONAR AEROLÍNEA</label>
      <select id="airlineSelect">
        <option value="">Cargando lista...</option>
      </select>
    </div>

    <button id="generateBtn" class="btn">Generar Vuelo Aleatorio (A320)</button>

    <p id="errorMsg" class="error-text" style="display: none;"></p>

    <div id="resultBox" class="result-box">
      <div class="result-item">
        <span class="result-label">Vuelo:</span>
        <span id="resFlight" class="result-value">-</span>
      </div>
      <div class="result-item">
        <span class="result-label">Origen:</span>
        <span id="resDep" class="result-value">-</span>
      </div>
      <div class="result-item">
        <span class="result-label">Destino:</span>
        <span id="resArr" class="result-value">-</span>
      </div>
      <a id="simbriefLink" href="#" target="_blank" class="simbrief-btn">Enviar a SimBrief</a>
    </div>
  </main>

  <script>
    const airlineSelect = document.getElementById('airlineSelect');
    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const errorMsg = document.getElementById('errorMsg');

    let currentRoutes = [];

    // 1. Cargar lista de aerolíneas desde el JSON
    async function initAirlines() {
      try {
        const response = await fetch('flightplans/airlines.json');
        if (!response.ok) throw new Error('No se encontró flightplans/airlines.json');
        
        const data = await response.json();
        
        airlineSelect.innerHTML = '<option value="">-- Selecciona una aerolínea --</option>';
        data.airlines.forEach(item => {
          const option = document.createElement('option');
          option.value = item.file;
          option.textContent = item.name;
          airlineSelect.appendChild(option);
        });
      } catch (err) {
        airlineSelect.innerHTML = '<option value="">Error al cargar aerolíneas</option>';
        showError(err.message);
      }
    }

    // 2. Al cambiar la opción en el menú desplegable
    airlineSelect.addEventListener('change', async (e) => {
      const fileName = e.target.value;
      resultBox.style.display = 'none';
      hideError();
      currentRoutes = [];

      if (!fileName) return;

      try {
        const response = await fetch(`flightplans/${fileName}`);
        if (!response.ok) throw new Error(`No se encontró el archivo flightplans/${fileName}`);
        
        const textData = await response.text();
        currentRoutes = parseAigFile(textData);
        
        if (currentRoutes.length === 0) {
          throw new Error(`El archivo ${fileName} no tiene rutas válidas reconocibles.`);
        }
      } catch (err) {
        showError(err.message);
      }
    });

    // 3. Parser ultra-flexible para cualquier formato AIG o texto plano
function parseAigFile(text) {
  const lines = text.split('\n');
  const parsedRoutes = [];

  lines.forEach(line => {
    // 1. Convertimos todo a mayúsculas y quitamos espacios al inicio/final
    const trimmed = line.trim().toUpperCase();
    if (!trimmed || trimmed.startsWith('//') || trimmed.startsWith('AC#')) return;

    // 2. Separamos por comas y limpiamos cada elemento
    const parts = trimmed.split(',').map(p => p.trim());

    // En formato AIG estándar:
    // parts[5] = Número de vuelo
    // parts[7] = Origen (ICAO)
    // parts[9] = Destino (ICAO)
    if (parts.length >= 10) {
      const flightNum = parts[5] ? parts[5].replace(/\D/g, '') : '';
      const dep = parts[7];
      const arr = parts[9];

      // Aceptamos cualquier código de 3 o 4 caracteres alfanuméricos
      if (dep && arr && dep.length >= 3 && arr.length >= 3) {
        parsedRoutes.push({
          flightNum: flightNum || Math.floor(100 + Math.random() * 8999).toString(),
          depICAO: dep,
          arrICAO: arr
        });
      }
    }
  });

  return parsedRoutes;
}

    // 4. Generar vuelo aleatorio
    generateBtn.addEventListener('click', () => {
      if (!airlineSelect.value) {
        showError('Por favor selecciona primero una aerolínea.');
        return;
      }

      if (currentRoutes.length === 0) {
        showError('No hay rutas disponibles para la aerolínea seleccionada.');
        return;
      }

      hideError();
      const randomRoute = currentRoutes[Math.floor(Math.random() * currentRoutes.length)];
      
      document.getElementById('resFlight').textContent = randomRoute.flightNum;
      document.getElementById('resDep').textContent = randomRoute.depICAO;
      document.getElementById('resArr').textContent = randomRoute.arrICAO;

      const simbriefUrl = `https://www.simbrief.com/system/dispatch.php?type=A320&orig=${randomRoute.depICAO}&dest=${randomRoute.arrICAO}&fltnum=${randomRoute.flightNum}`;
      document.getElementById('simbriefLink').href = simbriefUrl;

      resultBox.style.display = 'block';
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    initAirlines();
  </script>
</body>
</html>
