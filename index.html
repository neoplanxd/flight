<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c38bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2em;
    }

    select:focus, button:focus, .simbrief-btn:focus {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    button {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:active {
      background-color: #0369a1;
    }

    button:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    .status-msg {
      font-size: 0.8rem;
      text-align: center;
      margin-top: 10px;
      color: #64748b;
      min-height: 1.1em;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    .result-box {
      margin-top: 24px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      display: none;
    }

    .route-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
      gap: 12px;
    }

    .route-col {
      flex: 1;
      text-align: center;
    }

    .icao {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
      display: block;
    }

    .city {
      font-size: 0.95rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-top: 4px;
      display: block;
    }

    .flight-num {
      text-align: center;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .duration {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2px;
    }

    .aircraft-info {
      text-align: center;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px dashed #334155;
    }

    .aircraft-type {
      font-weight: 700;
      color: #f8fafc;
    }

    .addon-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #10b981;
    }

    .no-addon-tag {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #64748b;
    }

    .simbrief-btn {
      display: block;
      text-align: center;
      background-color: #10b981;
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 12px;
    }

    .simbrief-btn:active {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dispatch Portal</h1>
    <div class="subtitle">Xbox Flight Sim Companion</div>

    <div class="form-group">
      <label for="airlineSelect">SELECCIONAR AEROLÍNEA</label>
      <select id="airlineSelect">
        <option value="">Cargando aerolíneas...</option>
      </select>
    </div>

    <button id="generateBtn" disabled>Generar Vuelo Aleatorio</button>
    <div id="statusMsg" class="status-msg"></div>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultBox" class="result-box">
      <div class="flight-num">VUELO <span id="resFlight">----</span></div>
      <div class="duration" id="resDuration">--</div>
      <div class="route-display">
        <div class="route-col">
          <span id="resDep" class="icao">----</span>
          <span id="resDepCity" class="city"></span>
        </div>
        <span style="color: #64748b;">✈</span>
        <div class="route-col">
          <span id="resArr" class="icao">----</span>
          <span id="resArrCity" class="city"></span>
        </div>
      </div>
      <div id="aircraftInfo" class="aircraft-info" style="display:none;">
        <span id="aircraftType" class="aircraft-type"></span>
        <br>
        <span id="addonTag"></span>
      </div>
      <div class="form-group" style="margin-top: 12px; margin-bottom: 0;">
        <label for="platformSelect">MI AVIÓN</label>
        <select id="platformSelect"></select>
      </div>
      <a id="simbriefLink" class="simbrief-btn" target="_blank">Despachar en SimBrief</a>
    </div>
  </div>

  <script>
    const airlineSelect = document.getElementById('airlineSelect');
    const platformSelect = document.getElementById('platformSelect');
    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const errorMsg = document.getElementById('errorMsg');
    const statusMsg = document.getElementById('statusMsg');

    const PLATFORM_STORAGE_KEY = 'dispatchPortal.platform';

    let currentRoutes = [];
    let currentAirlineIcao = null;
    let lastFlightNum = null;
    let lastGeneratedRoute = null;
    let airportsDB = {};
    let aircraftTypeRules = [];
    let addonsDB = { platforms: {} };

    // ---------- Carga de catálogos genéricos (compartidos por TODAS las aerolíneas) ----------

    async function loadJSON(path, label) {
      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error(`No se encontró ${path}`);
        return await res.json();
      } catch (err) {
        console.warn(`No se pudo cargar ${label}:`, err.message);
        return null;
      }
    }

    async function initCatalogs() {
      const [airports, types, addons] = await Promise.all([
        loadJSON('flightplans/airports.json', 'airports.json'),
        loadJSON('flightplans/aircraft-types.json', 'aircraft-types.json'),
        loadJSON('flightplans/aircraft-addons.json', 'aircraft-addons.json')
      ]);

      airportsDB = airports || {};
      aircraftTypeRules = (types && types.rules) || [];
      addonsDB = addons || { platforms: {} };

      initPlatformSelect();
      initAirlines();
    }

    function initPlatformSelect() {
      const fleet = addonsDB.aircraft || [];

      platformSelect.innerHTML = '';
      fleet.forEach(plane => {
        const option = document.createElement('option');
        option.value = plane.id;
        option.textContent = plane.label;
        platformSelect.appendChild(option);
      });

      const saved = localStorage.getItem(PLATFORM_STORAGE_KEY);
      if (saved && fleet.some(p => p.id === saved)) {
        platformSelect.value = saved;
      }

      platformSelect.addEventListener('change', () => {
        localStorage.setItem(PLATFORM_STORAGE_KEY, platformSelect.value);
        if (lastGeneratedRoute) {
          renderAircraftInfo(lastGeneratedRoute.aircraftType);
          document.getElementById('simbriefLink').href = buildSimbriefUrl(lastGeneratedRoute);
        }
      });
    }

    function getMyAircraft() {
      const fleet = addonsDB.aircraft || [];
      return fleet.find(p => p.id === platformSelect.value) || null;
    }

    async function initAirlines() {
      try {
        const response = await fetch('flightplans/airlines.json');
        if (!response.ok) throw new Error('No se encontró flightplans/airlines.json');

        const data = await response.json();

        airlineSelect.innerHTML = '<option value="">-- Selecciona una aerolínea --</option>';
        data.airlines.forEach(item => {
          const option = document.createElement('option');
          option.value = item.file;
          option.textContent = item.name;
          option.dataset.icao = item.icao || '';
          airlineSelect.appendChild(option);
        });
      } catch (err) {
        airlineSelect.innerHTML = '<option value="">Error al cargar aerolíneas</option>';
        showError(err.message);
      }
    }

    // ---------- Carga y parseo del archivo de flightplans de la aerolínea seleccionada ----------

    airlineSelect.addEventListener('change', async (e) => {
      const fileName = e.target.value;
      currentAirlineIcao = e.target.selectedOptions[0] ? (e.target.selectedOptions[0].dataset.icao || null) : null;
      resultBox.style.display = 'none';
      hideError();
      hideStatus();
      currentRoutes = [];
      lastFlightNum = null;
      lastGeneratedRoute = null;
      generateBtn.disabled = true;

      if (!fileName) return;

      showStatus('Cargando rutas...');

      try {
        const response = await fetch(`flightplans/${fileName}`);
        if (!response.ok) throw new Error(`No se encontró el archivo flightplans/${fileName}`);

        const textData = await response.text();
        currentRoutes = parseAigFile(textData);

        if (currentRoutes.length === 0) {
          throw new Error(`El archivo ${fileName} no tiene rutas válidas reconocibles.`);
        }

        showStatus(`${currentRoutes.length} rutas encontradas`);
        generateBtn.disabled = false;
      } catch (err) {
        hideStatus();
        showError(err.message);
      }
    });

    // Detecta el tipo de aeronave ICAO a partir del texto libre del comentario de flota,
    // ej: "// Aeromexico - Boeing 787-9 Dreamliner GE 2-Class..." -> "B789"
    function detectAircraftType(commentText) {
      const upper = commentText.toUpperCase();
      for (const rule of aircraftTypeRules) {
        if (upper.includes(rule.pattern.toUpperCase())) {
          return rule.icao;
        }
      }
      return null;
    }

    // Convierte "día/HH:MM" (día 0-6 dentro de la semana del schedule) a minutos totales
    function scheduleTimeToMinutes(dayTime) {
      const [day, hm] = dayTime.split('/');
      const [hh, mm] = hm.split(':');
      return parseInt(day, 10) * 1440 + parseInt(hh, 10) * 60 + parseInt(mm, 10);
    }

    // Duración del tramo en minutos, manejando el cruce de fin de semana (día 6 -> día 0)
    function legDurationMinutes(depTime, arrTime) {
      const dep = scheduleTimeToMinutes(depTime);
      const arr = scheduleTimeToMinutes(arrTime);
      let diff = arr - dep;
      if (diff <= 0) diff += 7 * 1440;
      return diff;
    }

    function formatDuration(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h}h ${String(m).padStart(2, '0')}m`;
    }

    function parseAigFile(text) {
      const lines = text.split(/\r?\n/);
      const parsedRoutes = [];
      let currentFleetComment = '';
      let currentAircraftType = null;

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;

        if (trimmed.startsWith('//')) {
          currentFleetComment = trimmed.replace(/^\/\//, '').trim();
          currentAircraftType = detectAircraftType(currentFleetComment);
          return;
        }

        const matches = [...trimmed.matchAll(/(\d{1,2}\/\d{2}:\d{2}),@(\d{1,2}\/\d{2}:\d{2}),(\d{2,3}),F,(\d{1,4}),([A-Z]{4})\b/g)];

        // Si solo hay un tramo en la línea no hay forma confiable de saber el
        // aeropuerto de origen (no sabemos la base real de esa matrícula), así
        // que la descartamos en vez de inventar un origen.
        if (matches.length < 2) return;

        for (let i = 0; i < matches.length; i++) {
          const [, depTime, arrTime, , flightNum, arrICAO] = matches[i];
          // Ruta circular: el origen del primer tramo es el destino del último
          // tramo de la semana (la aeronave regresa a su base).
          const depICAO = i > 0 ? matches[i - 1][5] : matches[matches.length - 1][5];

          if (depICAO !== arrICAO) {
            parsedRoutes.push({
              flightNum: flightNum,
              depICAO: depICAO,
              arrICAO: arrICAO,
              aircraftType: currentAircraftType,
              fleetComment: currentFleetComment,
              durationMinutes: legDurationMinutes(depTime, arrTime)
            });
          }
        }
      });

      return parsedRoutes;
    }

    // ---------- Generar vuelo aleatorio ----------

    generateBtn.addEventListener('click', () => {
      if (!airlineSelect.value) {
        showError('Por favor selecciona primero una aerolínea.');
        return;
      }

      if (currentRoutes.length === 0) {
        showError('No hay rutas disponibles para la aerolínea seleccionada.');
        return;
      }

      hideError();

      let pool = currentRoutes;
      if (currentRoutes.length > 1 && lastFlightNum !== null) {
        const filtered = currentRoutes.filter(r => r.flightNum !== lastFlightNum);
        if (filtered.length > 0) pool = filtered;
      }

      const randomRoute = pool[Math.floor(Math.random() * pool.length)];
      lastFlightNum = randomRoute.flightNum;
      lastGeneratedRoute = randomRoute;

      document.getElementById('resFlight').textContent = randomRoute.flightNum;
      document.getElementById('resDuration').textContent = formatDuration(randomRoute.durationMinutes);
      document.getElementById('resDep').textContent = randomRoute.depICAO;
      document.getElementById('resArr').textContent = randomRoute.arrICAO;
      document.getElementById('resDepCity').textContent = cityLabel(randomRoute.depICAO);
      document.getElementById('resArrCity').textContent = cityLabel(randomRoute.arrICAO);

      renderAircraftInfo(randomRoute.aircraftType);

      const simbriefUrl = buildSimbriefUrl(randomRoute);
      document.getElementById('simbriefLink').href = simbriefUrl;

      resultBox.style.display = 'block';
    });

    function cityLabel(icao) {
      const entry = airportsDB[icao];
      if (!entry) return '';
      return entry.city || entry.name || '';
    }

    function renderAircraftInfo(scheduledType) {
      const box = document.getElementById('aircraftInfo');
      const typeEl = document.getElementById('aircraftType');
      const addonEl = document.getElementById('addonTag');
      const myPlane = getMyAircraft();

      if (!scheduledType && !myPlane) {
        box.style.display = 'none';
        return;
      }

      box.style.display = 'block';
      typeEl.textContent = scheduledType ? `Programado: ${scheduledType}` : 'Tipo programado desconocido';

      if (myPlane) {
        addonEl.className = 'addon-tag';
        addonEl.textContent = `Vas a volarlo con: ${myPlane.label}`;
      } else {
        addonEl.className = 'no-addon-tag';
        addonEl.textContent = 'Selecciona tu avión arriba';
      }
    }

    function buildSimbriefUrl(route) {
      const params = new URLSearchParams({
        orig: route.depICAO,
        dest: route.arrICAO,
        fltnum: route.flightNum
      });
      if (currentAirlineIcao) {
        params.set('airline', currentAirlineIcao);
      }
      const myPlane = getMyAircraft();
      if (myPlane) {
        params.set('type', myPlane.icaoType);
      } else if (route.aircraftType) {
        params.set('type', route.aircraftType);
      }
      return `https://dispatch.simbrief.com/options/custom?${params.toString()}`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function showStatus(msg) {
      statusMsg.textContent = msg;
    }

    function hideStatus() {
      statusMsg.textContent = '';
    }

    initCatalogs();
  </script>
</body>
</html>
