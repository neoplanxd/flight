<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    select, button {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    select {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c38bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2em;
    }

    button {
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button:active {
      background-color: #0369a1;
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    .result-box {
      margin-top: 24px;
      padding: 16px;
      background-color: #0f172a;
      border-radius: 8px;
      border: 1px solid #334155;
      display: none;
    }

    .route-display {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0;
    }

    .icao {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .flight-num {
      text-align: center;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
    }

    .simbrief-btn {
      display: block;
      text-align: center;
      background-color: #10b981;
      color: #ffffff;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      margin-top: 12px;
    }

    .simbrief-btn:active {
      background-color: #059669;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Dispatch Portal</h1>
    <div class="subtitle">Xbox Flight Sim Companion</div>

    <div class="form-group">
      <label for="airlineSelect">SELECCIONAR AEROLÍNEA</label>
      <select id="airlineSelect">
        <option value="">Cargando aerolíneas...</option>
      </select>
    </div>

    <div class="form-group">
      <label for="aircraftSelect">EQUIPO / AVIAÓN</label>
      <select id="aircraftSelect">
        <option value="A320">Airbus A320 (Corto / Medio Radio)</option>
        <option value="A339">Airbus A330-900 / A330</option>
        <option value="A359">Airbus A350-900 (Largo Radio)</option>
        <option value="B781">Boeing 787-10</option>
        <option value="B738">Boeing 737-800</option>
      </select>
    </div>

    <button id="generateBtn">Generar Vuelo Aleatorio</button>

    <div id="errorMsg" class="error-msg"></div>

    <div id="resultBox" class="result-box">
      <div class="flight-num">VUELO <span id="resFlight">----</span></div>
      <div class="route-display">
        <span id="resDep" class="icao">----</span>
        <span style="color: #64748b;">✈</span>
        <span id="resArr" class="icao">----</span>
      </div>
      <a id="simbriefLink" class="simbrief-btn" target="_blank">Despachar en SimBrief</a>
    </div>
  </div>

  <script>
    const airlineSelect = document.getElementById('airlineSelect');
    const aircraftSelect = document.getElementById('aircraftSelect');
    const generateBtn = document.getElementById('generateBtn');
    const resultBox = document.getElementById('resultBox');
    const errorMsg = document.getElementById('errorMsg');

    let currentRoutes = [];

    async function initAirlines() {
      try {
        const response = await fetch('flightplans/airlines.json');
        if (!response.ok) throw new Error('No se encontró flightplans/airlines.json');
        
        const data = await response.json();
        
        airlineSelect.innerHTML = '<option value="">-- Selecciona una aerolínea --</option>';
        data.airlines.forEach(item => {
          const option = document.createElement('option');
          option.value = item.file;
          option.textContent = item.name;
          airlineSelect.appendChild(option);
        });
      } catch (err) {
        airlineSelect.innerHTML = '<option value="">Error al cargar aerolíneas</option>';
        showError(err.message);
      }
    }

    airlineSelect.addEventListener('change', async (e) => {
      const fileName = e.target.value;
      resultBox.style.display = 'none';
      hideError();
      currentRoutes = [];

      if (!fileName) return;

      try {
        const response = await fetch(`flightplans/${fileName}`);
        if (!response.ok) throw new Error(`No se encontró el archivo flightplans/${fileName}`);
        
        const textData = await response.text();
        currentRoutes = parseAigFile(textData);
        
        if (currentRoutes.length === 0) {
          throw new Error(`El archivo ${fileName} no tiene rutas válidas reconocibles.`);
        }
      } catch (err) {
        showError(err.message);
      }
    });

    function parseAigFile(text) {
      const lines = text.split('\n');
      const parsedRoutes = [];

      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('//')) return;

        const matches = [...trimmed.matchAll(/,([0-9]{1,4}),([A-Z]{4})\b/g)];

        if (matches.length > 0) {
          for (let i = 0; i < matches.length; i++) {
            const flightNum = matches[i][1];
            const arrICAO = matches[i][2];
            
            let depICAO = "LEMD"; 
            if (i > 0) {
              depICAO = matches[i - 1][2];
            } else if (matches.length > 1) {
              depICAO = matches[matches.length - 1][2];
            }

            if (depICAO !== arrICAO) {
              parsedRoutes.push({
                flightNum: flightNum,
                depICAO: depICAO,
                arrICAO: arrICAO
              });
            }
          }
        }
      });

      return parsedRoutes;
    }

    generateBtn.addEventListener('click', () => {
      if (!airlineSelect.value) {
        showError('Por favor selecciona primero una aerolínea.');
        return;
      }

      if (currentRoutes.length === 0) {
        showError('No hay rutas disponibles para la aerolínea seleccionada.');
        return;
      }

      hideError();
      const randomRoute = currentRoutes[Math.floor(Math.random() * currentRoutes.length)];
      const selectedAircraft = aircraftSelect.value;
      
      document.getElementById('resFlight').textContent = randomRoute.flightNum;
      document.getElementById('resDep').textContent = randomRoute.depICAO;
      document.getElementById('resArr').textContent = randomRoute.arrICAO;

      const simbriefUrl = `https://www.simbrief.com/system/dispatch.php?type=${selectedAircraft}&orig=${randomRoute.depICAO}&dest=${randomRoute.arrICAO}&fltnum=${randomRoute.flightNum}`;
      document.getElementById('simbriefLink').href = simbriefUrl;

      resultBox.style.display = 'block';
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    initAirlines();
  </script>
</body>
</html>
